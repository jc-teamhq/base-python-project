# This repo is a Copier template (see copier.yml and template/), not an
# installable package. uv only manages the tooling used to develop and test
# the template, so its version comes from uv.lock like everything else.
[project]
name = "base-python-project"
version = "0.1.0"
description = "Copier template for a minimal, fully-typed Python project using uv, ruff, and ty."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "John Choi" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "copier>=9.19.1",
]
