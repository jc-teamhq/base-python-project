[project]
name = "base-python-project"
version = "0.1.0"
description = "A minimal, fully-typed Python project using uv, ruff, and ty."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# uv: dev tooling lives in a dependency group, installed by default with
# `uv sync` but excluded from the published package.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.19",
    "ty>=0.0.53",
]

# ---------------------------------------------------------------------------
# ruff: linter + formatter (https://docs.astral.sh/ruff/)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic default rule set. Add/remove codes to taste.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and don't need full docstring coverage.
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# ty: type checker (https://docs.astral.sh/ty/)
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.12"
# ty discovers the .venv automatically; pin the root for clarity.
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# Surface common mistakes as errors. See `ty check --help` and the docs
# for the full rule list; tune these to your team's tolerance.
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
