[project]
name = "base-python-project"
version = "0.1.0"
description = "A minimal, fully-typed Python project using uv, ruff, and ty."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "John Choi" }]
# PEP 639. Add an SPDX `license = "..."` expression once the exact terms
# (e.g. GPL-3.0-only vs GPL-3.0-or-later) are decided.
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
base-python-project = "base_python_project.__main__:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# uv: dev tooling lives in a dependency group, installed by default with
# `uv sync` but excluded from the published package.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
    "ty>=0.0.53",
]

# ---------------------------------------------------------------------------
# ruff: linter + formatter (https://docs.astral.sh/ruff/)
# The target Python version is inferred from `requires-python`.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic default rule set. Add/remove codes to taste.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "D",    # pydocstyle (docstrings)
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (enforce type hints)
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print (no stray print calls)
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests may use assert and don't need docstrings.
"tests/**/*.py" = ["S101", "D"]
# The CLI entry point is allowed to print.
"src/base_python_project/__main__.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# ty: type checker (https://docs.astral.sh/ty/)
# The target Python version is inferred from `requires-python`.
# ---------------------------------------------------------------------------
[tool.ty.environment]
# ty discovers the .venv automatically; pin the root for clarity.
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
# Surface common mistakes as errors. See `ty check --help` and the docs
# for the full rule list; tune these to your team's tolerance. Run with
# `--error-on-warning` (as pre-commit does) so warnings also fail.
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

# ---------------------------------------------------------------------------
# pytest (native TOML config, pytest >= 9)
# ---------------------------------------------------------------------------
[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--cov"]
# Enables strict_config, strict_markers, strict_xfail and
# strict_parametrization_ids.
strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage (collected via pytest-cov)
# ---------------------------------------------------------------------------
[tool.coverage.run]
source_pkgs = ["base_python_project"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
